<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>优化上架商品列表</title><style>*{box-sizing:border-box}body{font:16px/1.7 system-ui;margin:0;background:#f3f1eb;color:#17392f}main{max-width:1180px;margin:auto;padding:28px}header,section{padding:24px;background:white;border-radius:18px;margin:20px 0}a{color:#12654f}h1,h2{line-height:1.35}h1{font-size:32px}table{width:100%;border-collapse:collapse}th,td{padding:12px;border-bottom:1px solid #ddd;text-align:left;vertical-align:top}button,input,select{font:inherit;padding:9px;margin:5px;max-width:100%}button{cursor:pointer;border:1px solid #aac1b6;border-radius:8px;color:#17392f;background:#fff}button:disabled{opacity:.4}small{color:#666}pre{white-space:pre-wrap;overflow-wrap:anywhere;font:inherit}li{margin:12px 0}.notice{background:#fff4d6;padding:12px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px}.card{padding:22px;background:white;border-radius:14px}.scroll{overflow:auto}nav{display:flex;gap:20px;flex-wrap:wrap}.stat{font-size:24px;font-weight:700}#list li{padding:15px;border-bottom:1px solid #ddd}#list a{font-weight:600}.hero{background:#102c22;color:#fff}.hero a{color:#caeadd}@media(max-width:600px){main{padding:12px}header,section{padding:16px}h1{font-size:26px}table{font-size:14px}th,td{padding:7px}}.pagination{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:24px}.pagination button{margin:0;min-width:40px;height:42px;padding:6px 12px}.pagination .page-numbers{display:flex;align-items:center;gap:6px;flex-wrap:wrap}.pagination button[aria-current="page"]{background:#17392f;color:#fff;border-color:#17392f;opacity:1}.page-ellipsis{padding:0 5px;color:#65756e}.page-jump{display:flex;align-items:center;gap:8px;margin-left:12px}.page-jump input{width:76px;height:42px;margin:0;text-align:center;border:1px solid #aac1b6;border-radius:8px;padding:6px}.page-jump-message{flex-basis:100%;color:#a33025;font-size:14px}.page-jump-message:empty{display:none}.pagination button:focus-visible,.page-jump input:focus-visible{outline:3px solid #d98a3a;outline-offset:2px}@media(max-width:600px){.pagination{gap:6px}.pagination button{min-width:34px;padding:6px 8px}.page-numbers{gap:4px!important}.page-jump{margin-left:0;flex-basis:100%;margin-top:8px}}.return-target{background:#fff4d6;outline:3px solid #d98a3a;outline-offset:-3px;border-radius:10px}.return-target>a{scroll-margin-block:28vh}</style><style>.image-generated{background:#dceafa;color:#18518c}#imageSetStatusPanel small{display:block;margin-top:12px}</style></head><body><main><style>.status-badge{display:inline-block;background:#edf0ed;color:#58665f;padding:3px 10px;border-radius:20px;margin:4px 8px;font-size:14px;font-weight:600}.status-badge.listed{background:#d4eddd;color:#165e36}.status-error{background:#fff0d1;color:#7b4900}</style><nav><a href="../index.html">店铺总入口</a></nav><header class="hero"><h1>优化上架商品列表</h1><p><span class="stat">593</span> 款商品 · 整合 2996 条去重来源 · 来自 10 家店铺</p><p>按具体实物与独立采购主题整理，同款颜色花色不重复建品。标题参照每款实际来源整合，不使用批发字样。</p><p class="notice">新增 <a href="products/ALI-TZ-001216.html">黑底星空烫金烫银和纸胶带 ALI-TZ-001216</a>。</p></header><section><label>搜索 <input id="q" aria-label="搜索" placeholder="搜索名称 货号或英文标题"></label><label>每页条数 <select id="size" aria-label="每页条数"><option value="20">每页20条</option><option value="50">每页50条</option><option value="all">全部显示</option></select></label><label>上架状态 <select id="statusFilter" aria-label="上架状态"><option value="all">全部状态</option><option value="listed">已上架</option><option value="unmarked">未标记上架</option></select></label><details><summary>上架标记备份</summary><p>状态保存在当前浏览器，刷新或关闭页面后保留。不会自动跨设备同步；清除浏览器数据前请导出备份。</p><button id="statusExport">导出上架标记</button><label>导入上架标记 <input type="file" id="statusImport" accept="application/json,.json"></label><p id="statusMessage" role="status"></p></details><label>套图状态 <select id="imageSetFilter" aria-label="套图状态"><option value="all">全部套图状态</option><option value="generated">套图已生成</option><option value="unmarked">套图未标记</option></select></label><details><summary>套图标记与备份</summary><p>套图已生成仅表示生成完成，不代表已上架或用户验收。文件核验记录由网站共享；手动标记仅保存在当前浏览器，可导入导出。</p><button id="imageSetExport">导出套图标记</button><label>导入套图标记 <input id="imageSetImport" type="file" accept="application/json,.json"></label><p id="imageSetMessage" role="status"></p><button id="imageSetRetry" type="button">刷新套图记录</button></details><p id="count" aria-live="polite"></p><ol id="list"></ol><nav class="pagination" aria-label="商品列表分页"><button id="prev" aria-label="上一页">上一页</button><span id="pageNumbers" class="page-numbers"></span><button id="next" aria-label="下一页">下一页</button><span class="page-jump"><label for="pageJump">跳至</label><input id="pageJump" type="text" inputmode="numeric" pattern="[0-9]*" aria-label="跳转页码" aria-describedby="pageJumpMessage" autocomplete="off"><span>页</span><button id="pageGo" type="button">跳转</button></span><span id="pageJumpMessage" class="page-jump-message" role="status" aria-live="polite"></span></nav></section></main><script>// Manual workflow status only. This never submits or publishes an Alibaba listing.
// Separate from listing and sales state. Public verified records plus local manual overrides.
const imageSetStatus=(()=>{
 const key='labelnexor-image-set-status-v1',node=id=>document.getElementById(id);
 let shared=null,loadError=false,refresh=()=>{};
 function validate(d){
  if(!d||d.schema_version!==1||!d.records||Array.isArray(d.records)||typeof d.records!=='object')throw Error('套图记录格式异常');
  for(const [sku,r] of Object.entries(d.records))if(!/^ALI-TZ-\d{6}$/.test(sku)||r?.sku!==sku||typeof r.generated!=='boolean'||!Number.isFinite(Date.parse(r.updated_at)))throw Error('套图记录无效');
  return d;
 }
 function read(){const s=localStorage.getItem(key);return s?validate(JSON.parse(s)):{schema_version:1,records:{}};}
 function merge(a,b){validate(a);validate(b);const records={...a.records};for(const [sku,r] of Object.entries(b.records)){const old=records[sku];if(old&&Date.parse(old.updated_at)===Date.parse(r.updated_at)&&old.generated!==r.generated)throw Error('同时间状态冲突');if(!old||Date.parse(r.updated_at)>Date.parse(old.updated_at))records[sku]={...r};}return {schema_version:1,records};}
 function safeRead(){try{return {...merge(shared||{schema_version:1,records:{}},read()),pending:!shared&&!loadError,unavailable:loadError};}catch{return {schema_version:1,records:{},error:true};}}
 function badge(sku,d=safeRead()){const r=d.records[sku];return d.error?'<span class="status-badge status-error">套图状态异常</span>':r?.generated?'<span class="status-badge image-generated">套图已生成</span>':!r&&(d.pending||d.unavailable)?'<span class="status-badge">套图状态待读取</span>':'<span class="status-badge">套图未标记</span>';}
 function matches(sku,filter,d){if(!filter||filter==='all')return true;if(d.error)return false;const r=d.records[sku];if(!r&&(d.pending||d.unavailable))return false;return filter==='generated'?r?.generated===true:r?.generated!==true;}
 function save(sku,generated){const d=read(),s=safeRead();if(s.error||s.pending||s.unavailable)throw Error('请先成功读取共享记录');const previous=s.records[sku];const time=Math.max(Date.now(),previous?Date.parse(previous.updated_at)+1:0);d.records[sku]={sku,generated,updated_at:new Date(time).toISOString(),source:'manual'};validate(d);localStorage.setItem(key,JSON.stringify(d));}
 async function load(){try{if(typeof fetch!=='function')return;const url=document.getElementById('imageSetStatusPanel')?'../image-set-status.json':'image-set-status.json';const r=await fetch(url,{cache:'no-store'});if(!r.ok)throw Error('共享记录读取失败');shared=validate(await r.json());loadError=false;}catch{loadError=true;}finally{refresh();}}
 function message(text){if(node('imageSetMessage'))node('imageSetMessage').textContent=text;}
 function events(){window.addEventListener('storage',e=>{if(e.key===key||e.key===null)refresh();});window.addEventListener('pageshow',load);node('imageSetRetry')?.addEventListener('click',load);}
 function initDetail(sku){
  refresh=()=>{const d=safeRead(),r=d.records[sku];node('imageSetValue').innerHTML=badge(sku,d);node('imageSetTime').textContent=r?'最后修改 '+new Date(r.updated_at).toLocaleString()+(r.source==='manual'?' · 当前浏览器手动记录':' · 文件核验记录'):'';node('markImages').disabled=d.error||d.pending||d.unavailable||r?.generated===true;node('unmarkImages').disabled=d.error||d.pending||d.unavailable||r?.generated!==true;if(d.unavailable)message('共享记录加载失败 请重试 此时不会判断商品未生成');};
  for(const [id,yes] of [['markImages',true],['unmarkImages',false]])node(id).onclick=()=>{try{save(sku,yes);message(yes?'已手动标记套图生成 不代表上架或用户验收':'已取消当前浏览器的套图标记');refresh();}catch(e){message('未保存 '+e.message);}};
  events();refresh();return load();
 }
 function download(name,d){const u=URL.createObjectURL(new Blob([JSON.stringify(d,null,2)],{type:'application/json'})),a=document.createElement('a');a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000);}
 function initList(render){
  refresh=()=>{render();if(loadError)message('共享记录加载失败 未知商品不纳入未生成筛选 请重试');};
  node('imageSetFilter')?.addEventListener('change',()=>{pageNo=1;returnTarget="";clearReturnHighlight();render();});
  node('imageSetExport')?.addEventListener('click',()=>{try{const d=safeRead();if(d.error){download('image-set-status-original.json',{storage_key:key,raw:localStorage.getItem(key)});message('已导出异常原记录 请保留备份');return;}download('labelnexor-image-set-status.json',{schema_version:1,records:d.records});message('已导出套图标记');}catch(e){message(e.message);}});
  node('imageSetImport')?.addEventListener('change',async e=>{const f=e.target.files[0];if(!f)return;try{if(f.size>5*1024*1024)throw Error('文件超过5MB');const d=merge(read(),JSON.parse(await f.text()));localStorage.setItem(key,JSON.stringify(d));message('已导入较新套图记录');refresh();}catch(e){message('未导入 '+e.message);}finally{e.target.value='';}});
  events();return load();
 }
 return {key,validate,read,safeRead,merge,save,badge,matches,initList,initDetail,load};
})();

const listingStatus=(()=>{
 const key='labelnexor-listing-status-v1';
 const node=id=>document.getElementById(id);
 function validate(data){
  if(!data||data.schema_version!==1||!data.records||Array.isArray(data.records)||typeof data.records!=='object')throw Error('上架状态格式异常');
  for(const [sku,r] of Object.entries(data.records))if(!/^ALI-TZ-\d{6}$/.test(sku)||!r||r.sku!==sku||typeof r.listed!=='boolean'||typeof r.updated_at!=='string'||!Number.isFinite(Date.parse(r.updated_at)))throw Error('上架状态记录无效');
  return data;
 }
 function read(){const raw=localStorage.getItem(key);return raw?validate(JSON.parse(raw)):{schema_version:1,records:{}};}
 function safeRead(){try{return read();}catch{return {schema_version:1,records:{},error:true};}}
 function save(sku,listed){
  if(!/^ALI-TZ-\d{6}$/.test(sku)||typeof listed!=='boolean')throw Error('商品货号或状态无效');
  const data=read();data.records[sku]={sku,listed,updated_at:new Date().toISOString()};localStorage.setItem(key,JSON.stringify(data));return data.records[sku];
 }
 function badge(sku,data){return data.error?'<span class="status-badge status-error">状态无法读取</span>':data.records[sku]?.listed?'<span class="status-badge listed">已上架</span>':'<span class="status-badge">未标记</span>';}
 function initDetail(sku){
  function render(){const data=safeRead(),record=data.records[sku],listed=record?.listed===true;node('listingStatusValue').textContent=data.error?'状态无法读取 请先导出原始备份':listed?'已上架':'未标记上架';node('listingStatusValue').className='status-badge'+(listed?' listed':'');node('markListed').disabled=data.error||listed;node('unmarkListed').disabled=data.error||!listed;node('listingStatusTime').textContent=record?'最后修改 '+new Date(record.updated_at).toLocaleString():'';}
  for(const [id,listed] of [['markListed',true],['unmarkListed',false]])node(id).onclick=()=>{try{save(sku,listed);node('listingStatusMessage').textContent=listed?'已标记 列表中会显示已上架':'已取消标记';render();}catch{node('listingStatusMessage').textContent='保存失败 未覆盖原记录 请检查浏览器存储或先导出备份';}};
  window.addEventListener('storage',e=>{if(e.key===key||e.key===null)render();});window.addEventListener('pageshow',render);render();
 }
 function download(name,data){const url=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'})),a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);}
 function merge(current,incoming){
  validate(current);validate(incoming);const records={...current.records};
  for(const [sku,next] of Object.entries(incoming.records)){
   const previous=records[sku];if(previous&&Date.parse(previous.updated_at)===Date.parse(next.updated_at)&&previous.listed!==next.listed)throw Error('相同时间的状态冲突 未覆盖');
   if(!previous||Date.parse(next.updated_at)>Date.parse(previous.updated_at))records[sku]={...next};
  }
  return {schema_version:1,records};
 }
 function initList(render){
  node('statusExport').onclick=()=>{try{const raw=localStorage.getItem(key);try{download('labelnexor-listing-status.json',read());}catch{download('labelnexor-listing-status-original.json',{storage_key:key,raw});}node('statusMessage').textContent='已导出上架状态备份';}catch{node('statusMessage').textContent='导出失败 原记录保持不变';}};
  node('statusImport').onchange=async event=>{const f=event.target.files[0];if(!f)return;try{if(f.size>5*1024*1024)throw Error('文件超过5MB');const next=merge(read(),JSON.parse(await f.text()));localStorage.setItem(key,JSON.stringify(next));render();node('statusMessage').textContent='已合并导入 保留每款较新的标记';}catch(e){node('statusMessage').textContent='未导入 '+e.message;}finally{event.target.value='';}};
  window.addEventListener('storage',e=>{if(e.key===key||e.key===null)render();});window.addEventListener('pageshow',render);
 }
 return {key,read,safeRead,save,badge,merge,initDetail,initList};
})();
