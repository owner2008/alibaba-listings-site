function pageTokens(current,total){
 if(total<=8)return Array.from({length:total},(_,i)=>i+1);
 const start=Math.max(2,Math.min(current-2,total-6));
 const numbers=[1,...Array.from({length:6},(_,i)=>start+i),total],tokens=[];
 for(const n of numbers){if(tokens.length&&n-numbers[numbers.indexOf(n)-1]>1)tokens.push('…');tokens.push(n);}

}
